<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>2048</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <!-- Login Modal -->
        <div id="login-overlay">
            <div id="login-box">
                <h2>Welcome to 2048</h2>
                <p>Enter a username to track your high score.</p>
                <input type="text" id="username-input" placeholder="Username" maxlength="20" />
                <div id="login-error"></div>
                <button id="login-btn">Play</button>
            </div>
        </div>

        <h1>2048</h1>
        <hr>
        <div id="user-bar">
            <span id="welcome-msg"></span>
            <button id="logout-btn">Logout</button>
        </div>
        <h2>Score: <span id="score">0</span> &nbsp;|&nbsp; Best: <span id="best-score">0</span></h2>
        <div id="board">
        </div>
        <script src="2048.js"></script>
    </body>
</html>
